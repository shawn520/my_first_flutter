name: Flutter macOS App Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  build-macos-app:
    runs-on: macos-14  # macOS打包必须用macOS Runner
    timeout-minutes: 60  # macOS编译比iOS稍快

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 配置Xcode环境
      - name: Set up Xcode 15
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      # 2. 配置Flutter环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
          channel: 'stable'

      # 3. 初始化macOS项目
      - name: Initialize macOS Project
        run: |
          flutter create --platforms macos .
          # 验证macOS项目文件
          ls -la macos/Runner.xcodeproj || echo "❌ macOS项目文件生成失败"

      # 4. 安装依赖
      - name: Install Dependencies
        run: |
          flutter pub get
          cd macos && pod install --repo-update  # 下载macOS CocoaPods依赖

      # 5. 打包macOS调试版App（免签名，本地测试用）
      - name: Build macOS Debug App (Unsigned)
        run: |
          # --no-codesign：免签名，可在本地macOS右键「打开」运行
          flutter build macos --debug --no-codesign
          # 验证Debug产物
          ls -la build/macos/Build/Products/Debug/ || echo "❌ Debug App打包失败"

      # 6. 【可选】打包macOS发布版App（签名，避免运行警告）
      - name: Build macOS Release App (Signed)
        env:
          MACOS_CERT_BASE64: ${{ secrets.MACOS_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          # 导入macOS开发者证书
          echo $MACOS_CERT_BASE64 | base64 -d > macos_dist.p12
          security create-keychain -p github-actions macos-build.keychain
          security default-keychain -s macos-build.keychain
          security unlock-keychain -p github-actions macos-build.keychain
          security import macos_dist.p12 -k macos-build.keychain -P $CERT_PASSWORD -T /usr/bin/codesign

          # 打包签名的Release App
          flutter build macos --release --codesign --no-sandbox
          # 验证Release产物
          ls -la build/macos/Build/Products/Release/ || echo "❌ Release App打包失败"

          # 压缩App（便于上传/发布）
          cd build/macos/Build/Products/Release/
          zip -r YourAppName.app.zip YourAppName.app  # 替换为你的App名称

      # 7. 上传macOS App产物
      - name: Upload macOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flutter-macos-app-builds
          path: |
            build/macos/Build/Products/Debug/*.app
            build/macos/Build/Products/Release/*.app
            build/macos/Build/Products/Release/*.app.zip
          retention-days: 30
        if: always()

      # 8. 发布到GitHub Release（仅Tag触发时）
      - name: Release macOS App
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/macos/Build/Products/Release/*.app.zip
          name: macOS Release ${{ github.ref_name }}
          body: |
            Flutter macOS App 打包产物
            - Debug App：免签名，本地测试用
            - Release App：已签名，无运行安全警告
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}