name: Flutter Android Unsigned APK Build

on:
  push:
    branches: [ main, master, optimize_ci ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-unsigned-android-apk:
    runs-on: ubuntu-22.04  # 稳定的22.04环境，兼容所有Flutter版本
    timeout-minutes: 60  # 升级插件后依赖下载稍久，延长超时

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装安卓基础依赖（JDK 17 + Android SDK）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle  # 缓存Gradle依赖，加速后续构建

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3  # 自动安装安卓SDK，无需手动配置

      # 2. 配置Flutter环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
          channel: 'stable'

      # 3. 初始化Flutter安卓环境（核心修复：生成android目录和gradlew文件）
      - name: Initialize Flutter Android project
        run: |
          # 初始化安卓平台（若android目录缺失则自动生成，解决gradlew找不到问题）
          flutter create --platforms android .
          # 自动同意安卓SDK许可（关键：避免手动交互）
          flutter doctor --android-licenses --quiet
          # 验证android目录和gradlew文件是否存在（排障用）
          echo "===== 验证安卓项目核心文件 ====="
          ls -la android/
          ls -la android/gradlew || echo "❌ gradlew文件仍缺失（异常）"

      # 4. 升级file_picker插件到兼容版本（核心修复：解决v1 API兼容问题）
      - name: Upgrade file_picker to compatible version
        run: |
          # 升级file_picker到最新稳定版（支持Flutter 3.0+ v2嵌入API）
          flutter pub add file_picker:^8.0.0
          # 升级所有依赖，确保无版本冲突
          flutter pub upgrade
          # 验证插件版本
          echo "===== 验证file_picker版本 ====="
          grep "file_picker" pubspec.lock || echo "❌ file_picker未正确升级"

      # 5. 安装Flutter项目依赖（屏蔽剩余的跨平台配置警告）
      - name: Install Flutter dependencies
        run: |
          # 屏蔽插件配置警告（仅显示错误，不影响安卓打包）
          flutter pub get --suppress-analytics
        env:
          # 额外屏蔽Flutter的插件配置类警告，避免中断编译
          FLUTTER_QUIET: "true"

      # 6. 打包Debug版APK（默认非签名，开发测试用）
      - name: Build Debug APK (Unsigned)
        run: |
          # --split-per-abi：按架构拆分APK（减小体积），可选
          # FLUTTER_WARNINGS_ARE_ERRORS=false：屏蔽剩余的跨平台配置警告
          flutter build apk --debug --split-per-abi \
            --dart-define=FLUTTER_WARNINGS_ARE_ERRORS=false
          # 验证产物：打印APK列表，确认打包成功
          echo "===== Debug APK 产物 ====="
          ls -la build/app/outputs/flutter-apk/ || echo "❌ Debug APK打包失败"

      # 7. 打包未签名的Release版APK（优化编译，无签名）
      - name: Build Unsigned Release APK
        run: |
          # --no-sign：明确指定不签名（Flutter 3.0+支持）
          # FLUTTER_WARNINGS_ARE_ERRORS=false：屏蔽剩余的跨平台配置警告
          flutter build apk --release --no-sign --split-per-abi \
            --dart-define=FLUTTER_WARNINGS_ARE_ERRORS=false
          # 验证产物：打印APK列表+确认未签名
          echo "===== Unsigned Release APK 产物 ====="
          ls -la build/app/outputs/flutter-apk/
          # 检查APK签名状态（输出"No signature found"表示未签名，符合预期）
          for apk in build/app/outputs/flutter-apk/*release*.apk; do
            if [ -f "$apk" ]; then  # 容错：仅当APK文件存在时检查
              echo "===== 检查APK签名：$apk ====="
              jarsigner -verify -verbose -certs $apk || echo "✅ 该APK未签名（预期结果）"
            fi
          done

      # 8. 上传非签名APK产物（Debug + 未签名Release）
      - name: Upload Unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: flutter-android-unsigned-apks
          path: |
            build/app/outputs/flutter-apk/*debug*.apk
            build/app/outputs/flutter-apk/*release*.apk
          retention-days: 30  # 产物保留30天
        if: always()  # 容错：即使有警告，仍上传已生成的APK

      # 9. 发布到GitHub Release（仅Tag触发时）
      - name: Release Unsigned APKs
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*debug*.apk
            build/app/outputs/flutter-apk/*release*.apk
          name: Release ${{ github.ref_name }}
          body: |
            Flutter 非签名安卓APK包
            - Debug APK：含调试信息，适合开发测试
            - Unsigned Release APK：优化编译，无签名，仅用于内部验证
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}