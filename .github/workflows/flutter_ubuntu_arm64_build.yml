name: Flutter Ubuntu Build (ARM64 DEB)

on:
  push:
    branches: [ main, master, optimize_ci ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu-arm64-deb:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # ARM64交叉编译耗时更长，设置90分钟超时

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装基础依赖（含ARM64架构支持）
      - name: Install base dependencies
        run: |
          sudo apt-get update -y
          # 启用ARM64和32位架构支持（解决依赖安装问题）
          sudo dpkg --add-architecture arm64
          sudo dpkg --add-architecture i386
          sudo apt-get update -y
          # 基础编译依赖（替换libgl1-mesa-glx为通用libgl1，兼容新版Ubuntu）
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libssl-dev libgl1
          # DEB打包依赖
          sudo apt-get install -y dpkg-dev fakeroot
          # QEMU模拟工具（ARM64交叉编译必需）
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable
          # 兜底：安装Flutter Linux编译必需的GL依赖
          sudo apt-get install -y libglu1-mesa-dev freeglut3-dev mesa-common-dev
          # 修复依赖（防止安装失败）
          sudo apt-get -f install -y

      # 2. 安装ARM64交叉编译专属依赖
      - name: Install ARM64 cross-compile dependencies
        run: |
          # 安装ARM64交叉编译器
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # 安装ARM64架构的核心依赖库
          sudo apt-get install -y libgtk-3-dev:arm64 libgl1:arm64 libstdc++6:arm64 libssl3:arm64 liblzma-dev:arm64
          # 确认交叉编译器路径
          echo "AARCH64_GCC_PATH=$(which aarch64-linux-gnu-gcc)" >> $GITHUB_ENV
          echo "AARCH64_GXX_PATH=$(which aarch64-linux-gnu-g++)" >> $GITHUB_ENV

      # 3. 配置Flutter环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
          channel: 'stable'

      # 4. 启用Linux桌面支持
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # 5. 获取Flutter依赖
      - name: Get dependencies
        run: flutter pub get

      # 6. 编译ARM64版本（交叉编译）
      - name: Build Flutter Linux app (ARM64)
        run: |
          # 设置交叉编译环境变量
          export CC=aarch64-linux-gnu-gcc
          export CXX=aarch64-linux-gnu-g++
          export AR=aarch64-linux-gnu-ar
          export LD=aarch64-linux-gnu-ld
          export STRIP=aarch64-linux-gnu-strip
          
          # 编译ARM64版本（指定架构）
          flutter build linux --release --dart-define=ARCH=arm64 \
            --extra-front-end-options=--target-os=linux \
            --extra-front-end-options=--target-arch=arm64

      # 7. 构建ARM64专属DEB包（添加完整日志打印）
      - name: Build DEB package (ARM64)
        run: |
          # ========== 第一步：打印原始变量（排查根源） ==========
          echo "===== 原始变量值 ====="
          echo "RAW_VERSION: ${{ github.ref_name || github.sha }}"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "GITHUB_REF_NAME: ${{ github.ref_name }}"
          
          # 定义版本号和应用名
          # 修复：确保Version字段仅包含字母、数字、.+-，彻底移除下划线等非法字符
          # 优先级：tag版本(去v) > 分支名+提交哈希(0.0.0-前缀) > 纯提交哈希(0.0.0-前缀)
          RAW_VERSION=${{ github.ref_name || github.sha }}
          # 处理tag版本（如v1.0.0 → 1.0.0）
          if [[ $RAW_VERSION == v* ]]; then
            # 去v后再清理非法字符（防止tag中含下划线）
            APP_VERSION=$(echo ${RAW_VERSION:1} | sed 's/[^a-zA-Z0-9.+-]/-/g')
          else
            # 非tag版本：先清理分支名所有非法字符（包括下划线），再拼接短哈希
            SHA_SHORT=${{ github.sha }}
            SHA_SHORT=${SHA_SHORT:0:8}  # 截取哈希前8位，避免版本号过长
            # 关键修复：彻底替换所有非合法字符为-（包括下划线、空格等）
            CLEAN_BRANCH=$(echo $RAW_VERSION | sed 's/[^a-zA-Z0-9.+-]/-/g')
            # 拼接版本号，确保仅含合法字符
            APP_VERSION="0.0.0-${CLEAN_BRANCH}-${SHA_SHORT}"
            # 二次清理：防止拼接时引入非法字符（兜底）
            APP_VERSION=$(echo $APP_VERSION | sed 's/[^a-zA-Z0-9.+-]/-/g')
          fi
          
          # ========== 第二步：定义并清理包名（核心修复） ==========
          APP_NAME="my_flutter_app"  # 基础包名
          # 强制清理包名：仅保留小写字母、数字、-+.（符合DEB规范）
          APP_NAME_CLEAN=$(echo $APP_NAME | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9.+-]/-/g')
          
          # ========== 第三步：打印所有关键变量（排查错误） ==========
          echo -e "\n===== 处理后变量值 ====="
          echo "APP_VERSION (版本号): $APP_VERSION"
          echo "APP_NAME (原始包名): $APP_NAME"
          echo "APP_NAME_CLEAN (清理后包名): $APP_NAME_CLEAN"
          echo "CLEAN_BRANCH (清理后分支名): $CLEAN_BRANCH"
          echo "SHA_SHORT (短哈希): $SHA_SHORT"
          
          # 创建DEB目录结构
          DEB_ROOT="flutter_app_deb_arm64"
          DEB_DIR="$DEB_ROOT/opt/$APP_NAME_CLEAN"
          BIN_DIR="$DEB_ROOT/usr/bin"
          CONTROL_DIR="$DEB_ROOT/DEBIAN"
          
          mkdir -p $DEB_DIR $BIN_DIR $CONTROL_DIR
          
          # 复制ARM64编译产物
          cp -r build/linux/arm64/release/bundle/* $DEB_DIR/
          
          # 创建软链接（让用户可全局执行应用）
          ln -s /opt/$APP_NAME_CLEAN/$APP_NAME_CLEAN $BIN_DIR/$APP_NAME_CLEAN
          
          # ========== 第四步：编写control文件（固定ARM64架构） ==========
          # 重要：control文件内禁止任何形式的注释（#会被识别为非法字段名）
          echo -e "\n===== 生成的control文件内容 ====="
          # 核心：EOF前后无多余空格，闭合EOF与开头缩进一致（格式合规）
          cat > $CONTROL_DIR/control <<EOF
          Package: $APP_NAME_CLEAN
          Version: $APP_VERSION
          Architecture: arm64
          Maintainer: Your Name <your-email@example.com>
          Depends: libgtk-3-0:arm64, libstdc++6:arm64, libgl1:arm64, libssl3:arm64
          Section: utils
          Priority: optional
          Description: A Flutter application for Ubuntu (arm64)
            Auto-built DEB package for arm64 (aarch64) architecture.
          EOF
          
          # 打印control文件内容（直观排查）
          cat $CONTROL_DIR/control
          
          # 修复文件权限
          chmod -R 755 $DEB_ROOT
          chmod 644 $CONTROL_DIR/control
          
          # ========== 第五步：构建DEB包（含架构标识） ==========
          # 构建DEB包名（仅含合法字符）
          DEB_PACKAGE_NAME="${APP_NAME_CLEAN}_${APP_VERSION}_arm64.deb"
          # 清理包名中的非法字符（兜底）
          DEB_PACKAGE_NAME=$(echo $DEB_PACKAGE_NAME | sed 's/[^a-zA-Z0-9._-]/_/g')
          
          echo -e "\n===== 最终DEB包信息 ====="
          echo "DEB包名: $DEB_PACKAGE_NAME"
          echo "CONTROL文件Package字段: $APP_NAME_CLEAN"
          
          # 构建ARM64 DEB包
          fakeroot dpkg-deb --build $DEB_ROOT $DEB_PACKAGE_NAME
          
          # 验证DEB包（可选，确保包有效）
          echo -e "\n===== DEB包验证信息 ====="
          dpkg-deb -I $DEB_PACKAGE_NAME
          echo "DEB_PACKAGE_NAME=$DEB_PACKAGE_NAME" >> $GITHUB_ENV
        shell: /usr/bin/bash -e {0}
        env:
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.38.5-x64
          PUB_CACHE: /home/runner/.pub-cache

      # 8. 上传ARM64 DEB包（按架构区分）
      - name: Upload ARM64 DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ubuntu-deb-arm64
          path: ${{ env.DEB_PACKAGE_NAME }}
          retention-days: 30  # 保留30天

      # 9. 发布到GitHub Release（tag触发时）
      - name: Create GitHub Release (ARM64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB_PACKAGE_NAME }}
          name: Release ${{ github.ref_name }}
          body: "Automatic Ubuntu build for ${{ github.ref_name }}\n- arm64 (aarch64) architecture: ${{ env.DEB_PACKAGE_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}