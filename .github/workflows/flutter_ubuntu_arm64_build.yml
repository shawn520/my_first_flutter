name: Flutter Ubuntu Build (Native ARM64 DEB)

on:
  push:
    branches: [ main, master, optimize_ci ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ubuntu-arm64-deb:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        architecture: [arm64]
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 安装原生ARM64依赖
      - name: Install base dependencies (Native ARM64)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libssl-dev libgl1
          sudo apt-get install -y dpkg-dev fakeroot
          sudo apt-get install -y libglu1-mesa-dev freeglut3-dev mesa-common-dev
          sudo apt-get -f install -y

      # 2. 配置Flutter环境
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
          channel: 'stable'

      # 3. 启用Linux桌面支持
      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      # 4. 获取Flutter依赖
      - name: Get dependencies
        run: flutter pub get

      # 5. 原生编译ARM64版本
      - name: Build Flutter Linux app (Native ARM64)
        run: |
          # 原生ARM64编译（产物路径为build/linux/x64）
          flutter build linux --release --dart-define=ARCH=arm64
          # 关键：验证编译产物路径并打印架构信息
          echo "===== 验证编译产物 ====="
          # 打印产物目录结构
          ls -la build/linux/
          ls -la build/linux/x64/release/bundle/
          # 验证二进制架构（确认是ARM64）
          file build/linux/x64/release/bundle/my_flutter_app || true

      # 6. 构建ARM64 DEB包（修复路径）
      - name: Build DEB package (ARM64)
        run: |
          # ========== 变量处理 ==========
          echo "===== 原始变量值 ====="
          RAW_VERSION=${{ github.ref_name || github.sha }}
          echo "RAW_VERSION: $RAW_VERSION"
          
          # 版本号清理
          if [[ $RAW_VERSION == v* ]]; then
            APP_VERSION=$(echo ${RAW_VERSION:1} | sed 's/[^a-zA-Z0-9.+-]/-/g')
          else
            SHA_SHORT=${{ github.sha }}
            SHA_SHORT=${SHA_SHORT:0:8}
            CLEAN_BRANCH=$(echo $RAW_VERSION | sed 's/[^a-zA-Z0-9.+-]/-/g')
            APP_VERSION="0.0.0-${CLEAN_BRANCH}-${SHA_SHORT}"
          fi
          
          # 包名清理
          APP_NAME="my_flutter_app"
          APP_NAME_CLEAN=$(echo $APP_NAME | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9.+-]/-/g')
          
          echo -e "\n===== 处理后变量值 ====="
          echo "APP_VERSION: $APP_VERSION"
          echo "APP_NAME_CLEAN: $APP_NAME_CLEAN"
          
          # ========== 创建DEB目录 ==========
          DEB_ROOT="flutter_app_deb_arm64"
          DEB_DIR="$DEB_ROOT/opt/$APP_NAME_CLEAN"
          BIN_DIR="$DEB_ROOT/usr/bin"
          CONTROL_DIR="$DEB_ROOT/DEBIAN"
          
          mkdir -p $DEB_DIR $BIN_DIR $CONTROL_DIR
          
          # 修复核心：原生ARM64编译产物路径是build/linux/x64（不是arm64）
          # 先验证路径存在，再复制
          if [ -d "build/linux/x64/release/bundle" ]; then
            echo "✅ 找到编译产物，路径：build/linux/x64/release/bundle"
            cp -r build/linux/x64/release/bundle/* $DEB_DIR/
          else
            echo "❌ 编译产物路径不存在，打印目录结构排查："
            ls -la build/linux/
            exit 1
          fi
          
          # 创建软链接
          ln -s /opt/$APP_NAME_CLEAN/$APP_NAME_CLEAN $BIN_DIR/$APP_NAME_CLEAN
          
          # ========== 编写control文件 ==========
          echo -e "\n===== 生成的control文件内容 ====="
          cat > $CONTROL_DIR/control <<EOF
          Package: $APP_NAME_CLEAN
          Version: $APP_VERSION
          Architecture: arm64
          Maintainer: Your Name <your-email@example.com>
          Depends: libgtk-3-0, libstdc++6, libgl1, libssl3
          Section: utils
          Priority: optional
          Description: A Flutter application for Ubuntu (arm64)
            Auto-built DEB package for arm64 (aarch64) architecture.
          EOF
          
          cat $CONTROL_DIR/control
          
          # ========== 构建DEB包 ==========
          chmod -R 755 $DEB_ROOT
          chmod 644 $CONTROL_DIR/control
          
          DEB_PACKAGE_NAME="${APP_NAME_CLEAN}_${APP_VERSION}_arm64.deb"
          DEB_PACKAGE_NAME=$(echo $DEB_PACKAGE_NAME | sed 's/[^a-zA-Z0-9._-]/_/g')
          
          echo -e "\n===== 最终DEB包信息 ====="
          echo "DEB包名: $DEB_PACKAGE_NAME"
          
          fakeroot dpkg-deb --build $DEB_ROOT $DEB_PACKAGE_NAME
          dpkg-deb -I $DEB_PACKAGE_NAME
          echo "DEB_PACKAGE_NAME=$DEB_PACKAGE_NAME" >> $GITHUB_ENV
        shell: /usr/bin/bash -e {0}
        env:
          FLUTTER_ROOT: /opt/hostedtoolcache/flutter/stable-3.38.5-x64
          PUB_CACHE: /home/runner/.pub-cache

      # 7. 上传ARM64 DEB包
      - name: Upload ARM64 DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ubuntu-deb-arm64
          path: ${{ env.DEB_PACKAGE_NAME }}
          retention-days: 30

      # 8. 发布到GitHub Release
      - name: Create GitHub Release (ARM64)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DEB_PACKAGE_NAME }}
          name: Release ${{ github.ref_name }}
          body: "Native ARM64 build for Ubuntu: ${{ env.DEB_PACKAGE_NAME }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}